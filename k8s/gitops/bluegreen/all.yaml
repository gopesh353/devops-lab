apiVersion: v1
kind: Namespace
metadata:
  name: chatbot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: chatbot
data:
  GEMINI_MODEL: "gemini-3.5-flash-lite"
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-active
  namespace: chatbot
  labels:
    app: chatbot
spec:
  type: NodePort
  selector:
    app: chatbot
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-preview
  namespace: chatbot
  labels:
    app: chatbot
spec:
  type: ClusterIP
  selector:
    app: chatbot
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: chatbot
  namespace: chatbot
  labels:
    app: chatbot
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: chatbot
          image: devops-chatbot:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "1.0.0"
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
  strategy:
    blueGreen:
      activeService: chatbot-active
      previewService: chatbot-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
